[project]
name = "preftool"
version = "0.1.0"
description = "Capture, extract and inject developer preferences for agentic coding research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The SWE-Chat judge extractor only. Participants do not need these.
judge = ["pandas>=2.0", "numpy>=1.26"]

[project.scripts]
preftool = "preftool.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preftool", "src/extraction", "src/mapping"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "preftool"
version = "0.1.0"
description = "Capture, extract and inject developer preferences for agentic coding research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    # Required by the collaborator's extractor under src/extraction/, which
    # operates on pandas frames. preftool itself does not use them.
    "pandas>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
preftool = "preftool.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preftool", "src/extraction", "src/mapping"]

[tool.pytest.ini_options]
testpaths = ["tests"]
